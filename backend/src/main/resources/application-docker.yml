spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/travel_agency
    username: travel
    password: travel_secret

app:
  resend:
    api-key: ${RESEND_API_KEY:}
  mail:
    from: ${MAIL_FROM:}
  minio:
    endpoint: http://minio:9000
    # Публичный базовый URL без /travel-media — бэкенд сам добавляет bucket.
    # Переопределяется через APP_MINIO_PUBLIC_ENDPOINT в docker-compose (например https://tripwawe.ru).
    public-endpoint: ${APP_MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:8888}
    access-key: minioadmin
    secret-key: minioadmin_secret
  cors:
    allowed-origins:
      - http://localhost:8888
      - http://127.0.0.1:8888
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:18080
      - http://127.0.0.1:18080
