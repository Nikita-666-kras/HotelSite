services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel_secret
      POSTGRES_DB: travel_agency
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_agency"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secret
    expose:
      - "9000"
      - "9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: docker-compose-dev-only-change-for-production-minimum-thirty-two-chars-ok
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.tripwawe-http.rule=Host(`tripwawe.ru`) || Host(`www.tripwawe.ru`)
      - traefik.http.routers.tripwawe-http.entrypoints=web
      - traefik.http.routers.tripwawe-http.middlewares=tripwawe-redirect-https
      - traefik.http.routers.tripwawe.rule=Host(`tripwawe.ru`) || Host(`www.tripwawe.ru`)
      - traefik.http.routers.tripwawe.entrypoints=websecure
      - traefik.http.routers.tripwawe.tls=true
      - traefik.http.routers.tripwawe.tls.certresolver=le
      - traefik.http.services.tripwawe.loadbalancer.server.port=80
      - traefik.http.middlewares.tripwawe-redirect-https.redirectscheme.scheme=https

volumes:
  pgdata:
  miniodata:

networks:
  web:
    external: true
